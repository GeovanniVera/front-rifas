<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Icono de Nuvora</title>
  <desc id="desc">Bolsa de compras azul con una hoja turquesa, una órbita índigo y un destello coral.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0F1D45"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0.75">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="mint" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <!-- Asa y cuerpo de la bolsa -->
  <path fill="url(#navy)" fill-rule="evenodd" d="M112 191h43v-30c0-67 47-113 107-113s107 46 107 113v30h43l43 273H69l43-273Zm91 0h118v-30c0-39-25-66-59-66s-59 27-59 66v30Z"/>

  <!-- Hoja ascendente -->
  <path fill="url(#mint)" d="M176 335c8-91 66-169 170-217 4 108-42 191-151 236 35-37 72-82 107-139-49 48-88 86-126 120Z"/>

  <!-- Órbita de crecimiento -->
  <path fill="none" stroke="url(#indigo)" stroke-width="38" stroke-linecap="round" d="M48 319c30 77 138 103 249 72 60-17 112-49 145-86"/>

  <!-- Destello -->
  <path fill="url(#coral)" d="M383 38c9 31 25 48 56 57-31 9-47 25-56 56-9-31-25-47-56-56 31-9 47-26 56-57Z"/>
</svg>
